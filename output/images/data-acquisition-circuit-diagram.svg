<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754">
  <rect width="1240" height="1754" fill="#ffffff"/>
  <style>
    .title{font-family:Arial,sans-serif;font-weight:700;fill:#102a43;text-anchor:middle}.sub{font-family:Arial,sans-serif;font-size:15px;fill:#52677b;text-anchor:middle}.section{font-family:Arial,sans-serif;font-weight:700;font-size:18px;fill:#fff;text-anchor:middle}.card{fill:#fff;stroke:#1f4e79;stroke-width:2}.cardhead{font-family:Arial,sans-serif;font-weight:700;font-size:17px;fill:#102a43;text-anchor:middle}.desc{font-family:Arial,sans-serif;font-size:14px;fill:#26394d;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:12px;fill:#52677b;text-anchor:middle}.label{font-family:Arial,sans-serif;font-size:13px;fill:#1f4e79;text-anchor:middle;font-weight:700}.output{font-family:Arial,sans-serif;font-size:14px;fill:#fff;text-anchor:middle;font-weight:700}.caption{font-family:Arial,sans-serif;font-size:13px;fill:#52677b;text-anchor:middle}
  </style>
  <defs>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#1f4e79"/></marker>
    <marker id="greenArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#2f7d59"/></marker>
    <clipPath id="suitClip"><rect x="118" y="237" width="190" height="210" rx="8"/></clipPath>
    <clipPath id="gloveClip"><rect x="932" y="237" width="190" height="210" rx="8"/></clipPath>
    <clipPath id="headcamClip"><rect x="118" y="637" width="190" height="175" rx="8"/></clipPath>
    <clipPath id="phoneClip"><rect x="440" y="637" width="150" height="175" rx="8"/></clipPath>
    <clipPath id="coilClip"><rect x="732" y="637" width="150" height="175" rx="8"/></clipPath>
    <clipPath id="tripodClip"><rect x="932" y="637" width="190" height="175" rx="8"/></clipPath>
  </defs>
  <text class="title" font-size="30" x="620" y="52">DATA ACQUISITION: DEVICE CONNECTION FLOW</text>
  <text class="sub" x="620" y="80">Rokoko capture devices, physical dependencies and synchronized data output</text>

  <rect x="45" y="112" width="1150" height="38" rx="10" fill="#1f4e79"/>
  <text class="section" x="620" y="138">01  CAPTURE DEVICES WORN OR USED DURING THE SIGNING SESSION</text>

  <!-- suit -->
  <rect class="card" x="82" y="190" width="262" height="337" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-2541a192-d6cd-4d63-827f-2e58736676f5.jpg" x="118" y="237" width="190" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#suitClip)"/><rect x="118" y="237" width="190" height="210" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="213" y="474">Rokoko Smartsuit Pro II</text><text class="desc" x="213" y="498">Input: performer body motion</text><text class="small" x="213" y="517">Output: body skeletal data</text>
  <!-- gloves -->
  <rect class="card" x="896" y="190" width="262" height="337" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-d592fd60-7fe9-4b66-9fda-91037706c90d.jpg" x="932" y="237" width="190" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#gloveClip)"/><rect x="932" y="237" width="190" height="210" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="1027" y="474">Rokoko Smartgloves</text><text class="desc" x="1027" y="498">Input: hand and finger movement</text><text class="small" x="1027" y="517">Output: hand / finger data</text>
  <!-- central performer -->
  <rect x="425" y="245" width="390" height="185" rx="15" fill="#eaf2f8" stroke="#1f4e79" stroke-width="2"/>
  <text class="cardhead" x="620" y="285">INTERPRETER PERFORMING AN ISL SIGN</text><text class="desc" x="620" y="320">Body posture • arm motion • handshape</text><text class="desc" x="620" y="344">finger articulation • head movement • expression</text>
  <path d="M344 356 H425" stroke="#1f4e79" stroke-width="3" marker-end="url(#blueArrow)"/><path d="M896 356 H815" stroke="#1f4e79" stroke-width="3" marker-end="url(#blueArrow)"/>
  <text class="label" x="385" y="340">body sensors</text><text class="label" x="855" y="340">hand sensors</text>

  <rect x="45" y="572" width="1150" height="38" rx="10" fill="#2f7d59"/>
  <text class="section" x="620" y="598">02  DEVICE DEPENDENCIES FOR FACE CAPTURE AND HAND-POSITION ACCURACY</text>

  <!-- Headcam -->
  <rect class="card" x="82" y="590" width="262" height="330" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-09317111-2be6-4b68-9446-ef8bb9cc46fe.jpg" x="118" y="637" width="190" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#headcamClip)"/><rect x="118" y="637" width="190" height="175" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="213" y="841">Rokoko Headcam</text><text class="desc" x="213" y="865">Input: live face video</text><text class="small" x="213" y="884">Requires mobile connection</text>
  <!-- phone -->
  <rect class="card" x="404" y="590" width="222" height="330" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-17e014e5-6e8e-482f-993e-892ecb3dfd74.jpg" x="440" y="637" width="150" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClip)"/><rect x="440" y="637" width="150" height="175" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="515" y="841">Mobile Phone</text><text class="desc" x="515" y="865">Rokoko Face Capture app</text><text class="small" x="515" y="884">Output: facial animation data</text>
  <path d="M344 726 H404" stroke="#2f7d59" stroke-width="3" marker-end="url(#greenArrow)"/><text class="label" x="374" y="709">USB-C / video feed</text>
  <!-- coil -->
  <rect class="card" x="696" y="590" width="222" height="330" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-739aa808-3596-491a-a871-04188e6a5938.jpg" x="732" y="637" width="150" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#coilClip)"/><rect x="732" y="637" width="150" height="175" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="807" y="841">Rokoko Coil Pro</text><text class="desc" x="807" y="865">Hand-position reference</text><text class="small" x="807" y="884">Supports Smartglove tracking</text>
  <!-- tripod -->
  <rect class="card" x="896" y="590" width="262" height="330" rx="12"/><image href="file:///var/folders/57/tmp15_f52yn4pvhvhvwr1c540000gn/T/codex-clipboard-e2364492-59fe-4d4c-8d45-9168198619bc.jpg" x="932" y="637" width="190" height="175" preserveAspectRatio="xMidYMid slice" clip-path="url(#tripodClip)"/><rect x="932" y="637" width="190" height="175" rx="8" fill="none" stroke="#d2dde7" stroke-width="1"/><text class="cardhead" x="1027" y="841">Tripod</text><text class="desc" x="1027" y="865">Fixed physical support</text><text class="small" x="1027" y="884">Keeps Coil Pro stable</text>
  <path d="M1027 637 C1027 565, 850 550, 807 590" fill="none" stroke="#2f7d59" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#greenArrow)"/><text class="label" x="946" y="545">mounts / stabilizes</text>
  <path d="M807 590 C825 535, 930 510, 990 527" fill="none" stroke="#2f7d59" stroke-width="3" marker-end="url(#greenArrow)"/><text class="label" x="885" y="535">position reference for gloves</text>

  <!-- studio -->
  <rect x="45" y="1015" width="1150" height="38" rx="10" fill="#7c3d91"/>
  <text class="section" x="620" y="1041">03  SYNCHRONIZATION AND CAPTURE OUTPUT</text>
  <rect x="300" y="1100" width="640" height="300" rx="18" fill="#f5eff8" stroke="#7c3d91" stroke-width="3"/>
  <rect x="330" y="1130" width="580" height="54" rx="8" fill="#7c3d91"/><text class="output" x="620" y="1164">ROKOKO STUDIO INTERFACE</text>
  <rect x="345" y="1210" width="530" height="110" rx="8" fill="#fff" stroke="#c5a6d1" stroke-width="2"/>
  <text class="cardhead" x="610" y="1245">SYNCHRONIZED MOTION-CAPTURE TAKE</text><text class="desc" x="610" y="1272">Body skeletal stream + hand / finger stream</text><text class="desc" x="610" y="1295">+ facial-animation stream</text>
  <path d="M213 527 V1090 H430" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#blueArrow)"/><path d="M1027 527 V1090 H810" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#blueArrow)"/><path d="M515 920 V1080 H540" fill="none" stroke="#2f7d59" stroke-width="3" marker-end="url(#greenArrow)"/>
  <text class="label" x="280" y="1077">body data</text><text class="label" x="957" y="1077">hand / finger data</text><text class="label" x="485" y="1068">facial data</text>
  <path d="M620 1400 V1450" stroke="#7c3d91" stroke-width="4" marker-end="url(#blueArrow)"/>
  <rect x="340" y="1480" width="560" height="110" rx="12" fill="#102a43"/>
  <text class="output" x="620" y="1523">OUTPUT: COMBINED ROKOKO FBX FILE</text><text class="output" font-size="14" x="620" y="1552">One synchronized source file for ingestion into SignSure</text>
  <text class="caption" x="620" y="1685">Figure 3.2: Circuit-style representation of the data-acquisition setup. Solid arrows show motion-data flow; dashed arrows show physical device dependency.</text>
</svg>
